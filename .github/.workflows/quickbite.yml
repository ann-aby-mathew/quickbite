name: HTML Continuous Integration

# Trigger the pipeline on every push or pull request to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Set up Ruby (required to run html-proofer)
    - name: Set up Ruby
      uses: actions/setup-ruby@v1
      with:
        ruby-version: '3.2'

    # Step 3: Install HTML-Proofer
    - name: Install HTML Proofer
      run: gem install html-proofer

    # Step 4: Validate HTML files (assumes your files are in the root or a 'public' folder)
    - name: Test HTML Files
      run: htmlproofer ./ --disable-external